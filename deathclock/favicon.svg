<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark circular background -->
  <circle cx="32" cy="32" r="30" fill="#07070a" stroke="#e63946" stroke-width="2.5" />
  
  <!-- Clock ticks -->
  <line x1="32" y1="4" x2="32" y2="8" stroke="#f0f0f5" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="32" x2="56" y2="32" stroke="#f0f0f5" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="60" x2="32" y2="56" stroke="#f0f0f5" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="32" x2="8" y2="32" stroke="#f0f0f5" stroke-width="2" stroke-linecap="round" />

  <!-- Clock hands (Approaching midnight) -->
  <line x1="32" y1="32" x2="24" y2="16" stroke="#ffb703" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="32" x2="32" y2="12" stroke="#f0f0f5" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="32" x2="44" y2="28" stroke="#e63946" stroke-width="1.2" stroke-linecap="round" />

  <!-- Stylized Center Skull -->
  <g transform="translate(32, 35) scale(0.24)">
    <path d="M 0 -58 C -38 -58 -54 -32 -54 -2 C -54 18 -44 32 -36 40 C -33 43 -28 46 -24 48 L -24 64 C -24 68 -20 72 -16 72 L 16 72 C 20 72 24 68 24 64 L 24 48 C 28 46 33 43 36 40 C 44 32 54 18 54 -2 C 54 -32 38 -58 0 -58 Z"
          fill="#12131d" stroke="#f0f0f5" stroke-width="6" stroke-linejoin="round" />
    <!-- Eyes -->
    <ellipse cx="-18" cy="8" rx="10" ry="12" fill="#e63946" />
    <ellipse cx="18" cy="8" rx="10" ry="12" fill="#e63946" />
    <!-- Nose -->
    <polygon points="0,22 -6,34 6,34" fill="#f0f0f5" />
    <!-- Teeth -->
    <line x1="-14" y1="58" x2="14" y2="58" stroke="#f0f0f5" stroke-width="4" />
    <line x1="-8" y1="52" x2="-8" y2="64" stroke="#f0f0f5" stroke-width="3" />
    <line x1="0" y1="50" x2="0" y2="66" stroke="#f0f0f5" stroke-width="3" />
    <line x1="8" y1="52" x2="8" y2="64" stroke="#f0f0f5" stroke-width="3" />
  </g>

  <!-- Pivot dot -->
  <circle cx="32" cy="32" r="2.5" fill="#f0f0f5" stroke="#e63946" stroke-width="1" />
</svg>
